<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gl-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4FF6B"/>
      <stop offset=".5" stop-color="#3DFF8A"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <radialGradient id="gl-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0F2E1E"/>
      <stop offset="1" stop-color="#030A06"/>
    </radialGradient>
    <linearGradient id="gl-sweep" x1="256" y1="256" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DFF8A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3DFF8A" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="gl-clip"><rect width="512" height="512" rx="120"/></clipPath>
  </defs>
  <g clip-path="url(#gl-clip)">
    <rect width="512" height="512" fill="url(#gl-bg)"/>
    <g stroke="#3DFF8A" stroke-opacity=".07" stroke-width="2">
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
    </g>
    <g fill="none" stroke="#3DFF8A" stroke-opacity=".18" stroke-width="3">
      <circle cx="256" cy="256" r="200"/>
      <circle cx="256" cy="256" r="120"/>
    </g>
    <path d="M256 256 L456 256 A200 200 0 0 0 397 115 Z" fill="url(#gl-sweep)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#3DFF8A" stroke-opacity=".35" stroke-width="4"/>
  <g filter="url(#gl-glow)" fill="none" stroke="url(#gl-ring)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M382 186 A150 150 0 0 0 406 256 L282 256" stroke-width="46"/>
  </g>
  <circle cx="397" cy="115" r="18" fill="#D4FF6B" filter="url(#gl-glow)"/>
